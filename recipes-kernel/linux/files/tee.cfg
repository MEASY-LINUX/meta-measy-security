# tee.cfg
# OP-TEE Trusted Keys backend kernel config fragment
#
# The myir-encrypted override selects this fragment via
# ${MYIR_ENC_KEY_BACKEND}.cfg for dm-crypt. linux-optee.inc also loads
# it for secure storage when MYIR_OPTEE_STORAGE = "rpmb".
#
# i.MX95 uses ELE and OP-TEE for Trusted Keys and lacks CAAM hardware.
# This fragment replaces caam.cfg and disables the CAAM and TPM backends.

# Trusted Keys framework
CONFIG_TRUSTED_KEYS=y

# OP-TEE backend for Trusted Keys
CONFIG_TRUSTED_KEYS_TEE=y

# i.MX95 uses ELE in place of CAAM.
# CONFIG_TRUSTED_KEYS_CAAM is not set

# Enable this backend only with a hardware TPM or fTPM.
# CONFIG_TRUSTED_KEYS_TPM is not set

# Cryptographic primitives required by Trusted Keys
CONFIG_CRYPTO_AUTHENC=y
CONFIG_CRYPTO_CBC=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_ESSIV=y

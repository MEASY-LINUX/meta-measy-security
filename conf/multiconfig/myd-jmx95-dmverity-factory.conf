# Inherit MACHINE from the top-level build configuration.  The target and
# factory configurations must always build for the same board revision.
TMPDIR = "${TOPDIR}/tmp-factory"

# The eMMC payload remains the full AHAB + signed FIT + dm-verity product.
MYIR_FACTORY_TARGET_DM_VERITY = "1"
MYIR_FACTORY_TARGET_FITIMAGE_BOOT = "1"
MYIR_FACTORY_TARGET_AHAB = "1"

# Preserve the product OTA selection for the burner, but do not turn the
# writable factory SD itself into an OTA product system.
MYIR_FACTORY_TARGET_OTA := "${OTA_SUPPORT}"
OTA_SUPPORT = "0"

# The SD provisioning system uses AHAB-only boot and a writable ext4 rootfs.
ENABLE_DM_VERITY = "0"
MYIR_SECURE_BOOT = "1"

MYIR_FACTORY_TARGET_MC = "target"
MYIR_FACTORY_TARGET_DEPLOY_DIR = "${TOPDIR}/tmp-target/deploy/images/${MACHINE}"
MYIR_FACTORY_MCDEPENDS = "mc:${BB_CURRENT_MC}:target:myir-image-emmc:do_image_complete"
